name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
        react: ['18', '19']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - if: matrix.react == '18'
        run: npx --yes npm@11 install --no-save --package-lock=false react@18 react-dom@18 @types/react@18 @types/react-dom@18
      - run: npm run check
      - run: npm audit --omit=dev --audit-level=high
